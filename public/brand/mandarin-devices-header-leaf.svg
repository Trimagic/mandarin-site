    <path d="M128 80C130 36 165 13 229 14C219 61 188 92 148 81C140 79 133 79 128 80Z" fill="url(#placed-leaf-gradient)"/>
    <path d="M133 77C156 48 186 32 217 21C194 40 169 58 148 81C142 79 137 78 133 77Z" fill="#164F2D" opacity=".14"/>
    <path d="M134 76C156 50 183 35 213 24" stroke="#D0E994" stroke-opacity=".5" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M157 54C159 46 161 40 166 34M174 41C184 43 191 43 198 41" stroke="#D0E994" stroke-opacity=".2" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
